name: Verify Scribeva

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Verify package and website
        run: npm run check
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Verify browser behavior
        run: npm run test:e2e -- --grep-invert "visual baseline"
